name: taste_app
description: App de descoberta de restaurantes com IA
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.4.9
  equatable: ^2.0.5
  dartz: ^0.10.1
  
  # Network & API
  supabase_flutter: ^2.0.0
  dio: ^5.3.2
  http: ^1.1.0
  connectivity_plus: ^5.0.1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.4
  
  # Location & Maps
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3
  geocoding: ^2.1.1
  
  # UI & UX
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  flutter_svg: ^2.0.9
  introduction_screen: ^3.1.12
  smooth_page_indicator: ^1.1.0
  google_fonts: ^4.0.5
  lucide_icons: ^0.257.0
  visibility_detector: ^0.4.0+2
  
  # Navigation
  go_router: ^12.1.1
  
  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2
  
  # Utils
  intl: ^0.18.1
  url_launcher: ^6.2.1
  permission_handler: ^11.0.1
  image_picker: ^1.0.4
  share_plus: ^7.2.1
  path: ^1.8.3
  image: ^4.1.3
  
  # Environment
  flutter_dotenv: ^5.1.0
  
  # Serialization
  json_annotation: ^4.8.1

  # Web URL strategy
  url_strategy: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  injectable_generator: ^2.4.1
  json_serializable: ^6.7.1
  
  # Testing
  mockito: ^5.4.2
  
  # Linting
  flutter_lints: ^3.0.1
  very_good_analysis: ^5.1.0

# Custom scripts for build automation
scripts:
  build:debug: "powershell -ExecutionPolicy Bypass -File scripts/build_debug.ps1"
  build:release: "powershell -ExecutionPolicy Bypass -File scripts/build_release.ps1"
  dev: "flutter run -d chrome --dart-define=ENVIRONMENT=development"
  prod: "flutter run -d chrome --dart-define=ENVIRONMENT=production --release"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/lottie/
    - .env.development
    - .env.production
  
